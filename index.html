
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03050a">

<title>SMART GA | Gebäudeautomation & Engineering</title>

<meta name="description" content="SMART GA – Smart Home, System Engineering, Software Engineering, Systemintegration, Visualisierung und Inbetriebnahme. Bregenz, Vorarlberg.">

<link rel="icon" href="favicon.png" type="image/png">

<style>

/* =========================================
   GLOBAL DESIGN
========================================= */

:root {
    --bg: #03050a;
    --surface: #080b11;
    --panel: #101b2b;
    --cyan: #20f3d2;
    --blue: #4b8cff;
    --purple: #9a6cff;
    --text: #f6f8fb;
    --muted: #bcc8d5;
    --line: rgba(255,255,255,.10);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

a {
    color: var(--cyan);
    text-decoration: none;
}

button {
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
}

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 5px;
}

p {
    color: var(--muted);
    line-height: 1.8;
}

.wrap {
    width: min(1240px, calc(100% - 48px));
    margin: auto;
}

/* =========================================
   NAVIGATION
========================================= */

nav {
    position: fixed;
    top: 18px;
    left: 0;
    right: 0;
    z-index: 100;
}

.nav {
    min-height: 66px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: rgba(9,13,20,.94);
    backdrop-filter: blur(25px);
    box-shadow: 0 18px 60px rgba(0,0,0,.22);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 900;
    color: var(--text);
    direction: ltr;
    white-space: nowrap;
}

.mark {
    width: 35px;
    height: 35px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: linear-gradient(
        135deg,
        var(--cyan),
        var(--blue),
        var(--purple)
    );
    color: #ffffff;
    box-shadow: 0 0 32px rgba(32,243,210,.22);
}

.brand b {
    color: var(--cyan);
}

.links {
    display: flex;
    align-items: center;
    gap: 26px;
}

.links a,
.dropdown-trigger {
    border: none;
    background: transparent;
    color: #d5dee7;
    font-size: 13px;
    padding: 10px 0;
    white-space: nowrap;
    transition: color .2s ease;
}

.links a:hover,
.links a.active,
.dropdown-trigger:hover,
.dropdown-trigger.active {
    color: var(--cyan);
}

.dropdown {
    position: relative;
}

.dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    inset-inline-start: 0;
    min-width: 245px;
    padding: 10px;
    background: #101b2b;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 20px 45px rgba(0,0,0,.35);
}

.dropdown-menu.open {
    display: grid;
}

.dropdown-menu a {
    display: block;
    padding: 13px;
    border-radius: 7px;
}

.dropdown-menu a:hover {
    background: rgba(255,255,255,.05);
}

@media (hover:hover) {
    .dropdown:hover .dropdown-menu {
        display: grid;
    }
}

.lang {
    display: flex;
    direction: ltr;
    gap: 3px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 12px;
}

.lang button {
    border: 0;
    padding: 8px 10px;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
}

.lang button.on {
    background: #205eae;
    color: #ffffff;
}

/* =========================================
   HERO
========================================= */

.hero {
    position: relative;
    min-height: 780px;
    overflow: hidden;

    background:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle at 73% 43%,
            rgba(20,94,170,.28),
            transparent 35%
        ),
        radial-gradient(
            circle at 86% 22%,
            rgba(125,76,255,.15),
            transparent 30%
        ),
        #03050a;

    background-size:
        72px 72px,
        72px 72px,
        auto,
        auto,
        auto;
}

.hero-grid {
    min-height: 780px;
    display: grid;
    grid-template-columns: .95fr 1.05fr;
    align-items: center;
    gap: 55px;
    padding-top: 100px;
}

.eyebrow {
    color: var(--cyan);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .14em;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(45px, 6vw, 86px);
    line-height: 1.02;
    letter-spacing: -.055em;
    margin: 24px 0;
    color: var(--text);
    overflow-wrap: anywhere;
}

h2 {
    font-size: clamp(30px, 4vw, 50px);
    letter-spacing: -.035em;
    color: var(--text);
}

h3 {
    color: var(--text);
}

.soft {
    color: #aebdcb;
}

.glow {
    background: linear-gradient(
        90deg,
        var(--cyan),
        var(--blue),
        var(--purple)
    );
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.lead {
    font-size: 17px;
    max-width: 650px;
    color: #d3dce6;
}

.company-status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-top: 20px;
    color: #e2f2ef;
    font-size: 12px;
    line-height: 1.6;
    border: 1px solid rgba(32,243,210,.25);
    border-radius: 12px;
    background: rgba(32,243,210,.06);
}

.status-dot {
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
}

/* =========================================
   HERO VISUAL
========================================= */

.visual {
    position: relative;
    height: 500px;
    display: grid;
    place-items: center;
    direction: ltr;
}

.orb {
    position: absolute;
    width: 340px;
    height: 340px;
    border: 1px solid rgba(32,243,210,.23);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(29,119,211,.22),
        transparent 70%
    );
    box-shadow: 0 0 85px rgba(75,140,255,.12);
}

.orb::before {
    content: "";
    position: absolute;
    inset: -30px;
    border: 1px solid rgba(154,108,255,.22);
    border-radius: 50%;
}

.orb::after {
    content: "";
    position: absolute;
    inset: 55px;
    border: 1px dashed rgba(75,140,255,.40);
    border-radius: 50%;
    animation: spin 25s linear infinite;
}

.core {
    width: 110px;
    height: 110px;
    border-radius: 28px;
    display: grid;
    place-items: center;
    z-index: 2;
    background: linear-gradient(
        135deg,
        var(--cyan),
        var(--blue),
        var(--purple)
    );
    color: #ffffff;
    font-size: 45px;
    font-weight: 900;
    box-shadow: 0 0 60px rgba(75,140,255,.45);
}

.node {
    position: absolute;
    width: 42%;
    max-width: 230px;
    padding: 18px;
    background: rgba(16,27,43,.96);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 20px 45px rgba(0,0,0,.30);
    animation: float 6s ease-in-out infinite;
}

.node svg {
    width: 35px;
    height: 35px;
    stroke: #9be9ef;
    fill: none;
    stroke-width: 1.6;
    margin-bottom: 10px;
}

.node strong {
    display: block;
    font-size: 13px;
    color: var(--text);
}

.node small {
    display: block;
    margin-top: 8px;
    font-size: 10px;
    color: var(--muted);
}

.n1 { top: 35px; left: 0; }
.n2 { top: 65px; right: 0; animation-delay: -1.5s; }
.n3 { bottom: 55px; left: 3%; animation-delay: -3s; }
.n4 { bottom: 30px; right: 0; animation-delay: -4.5s; }

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* =========================================
   PAGES AND SERVICES
========================================= */

.section {
    padding: 90px 0;
    background: var(--surface);
}

.page {
    min-height: 75vh;
    padding: 155px 0 90px;
    background:
        radial-gradient(
            ellipse at top right,
            rgba(75,140,255,.10),
            transparent 65%
        ),
        var(--surface);
}

.page h1 {
    font-size: clamp(38px, 5vw, 65px);
}

.intro {
    max-width: 850px;
    font-size: 16px;
    margin-bottom: 35px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(230px, 1fr)
    );
    gap: 20px;
    margin: 35px 0;
}

.cards.categories {
    grid-template-columns: repeat(2, 1fr);
}

/* =========================================
   INTERACTIVE FLIP CARDS
========================================= */

.flip-card {
    position: relative;
    min-height: 320px;
    perspective: 1200px;
    cursor: pointer;
}

.card-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.2,.7,.2,1);
}

.flip-card.flipped .card-inner {
    transform: rotateY(180deg);
}

@media (hover:hover) {
    .flip-card:hover .card-inner {
        transform: rotateY(180deg);
    }
}

.card-face {
    position: absolute;
    inset: 0;
    padding: 26px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(
        145deg,
        #162131,
        #0b111a
    );
    overflow: auto;
}

.card-back {
    transform: rotateY(180deg);
    justify-content: flex-start;
    background: linear-gradient(
        145deg,
        #102b3a,
        #0b131f
    );
    border-color: rgba(32,243,210,.25);
}

.card-number {
    position: absolute;
    top: 18px;
    inset-inline-end: 20px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .12em;
}

.card-icon {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    margin-bottom: 25px;
    border-radius: 13px;
    background: var(--accent, #245d99);
}

.card-icon svg {
    width: 31px;
    height: 31px;
    stroke: #ffffff;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.card-front h3 {
    margin: 0 0 12px;
    font-size: 21px;
}

.card-back h3 {
    color: var(--cyan);
    font-size: 16px;
    margin: 0 0 15px;
}

.card-back p {
    color: #d3dce6;
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 15px;
}

.technologies {
    color: #9cc6ff;
    font-size: 12px;
    line-height: 1.7;
}

.card-hint {
    margin-top: auto;
    padding-top: 20px;
    color: var(--muted);
    font-size: 11px;
}

.open-page {
    display: inline-block;
    padding: 10px 14px;
    margin-top: 18px;
    border: 1px solid rgba(32,243,210,.35);
    border-radius: 8px;
    color: #e3fffc;
    font-size: 12px;
}

/* =========================================
   LOXONE PARTNER
========================================= */

.partner-logo {
    display: block;
    width: 155px;
    max-width: 100%;
    height: auto;
    margin: 16px 0;
    padding: 8px;
    border-radius: 5px;
    background: #ffffff;
}

/* =========================================
   COMMUNICATION TECHNOLOGIES
========================================= */

.protocols {
    margin: 40px 0;
    padding: 28px;
    background: #0c1522;
    border: 1px solid var(--line);
    border-radius: 16px;
}

.protocols summary {
    cursor: pointer;
    color: var(--text);
    font-size: 19px;
    font-weight: 650;
}

.protocol-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 30px;
    padding: 23px 0;
    border-top: 1px solid var(--line);
    line-height: 1.8;
}

.protocol-title {
    display: flex;
    align-items: center;
    gap: 13px;
    color: #9cc6ff;
}

.protocol-title svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    stroke: #9cc6ff;
    fill: none;
    stroke-width: 1.6;
}

.protocol-values {
    color: #d3dce6;
    font-size: 14px;
}

/* =========================================
   APPLICATIONS / MODERNIZATION
========================================= */

.applications {
    margin: 45px 0;
    padding: 5px 22px;
    border-inline-start: 2px solid var(--cyan);
}

.applications h3 {
    font-size: 21px;
    margin: 0 0 12px;
}

.applications p {
    max-width: 950px;
    margin: 0;
    font-size: 15px;
}

/* =========================================
   PROJECT BUTTON
========================================= */

.cta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    padding-top: 28px;
    margin-top: 35px;
    border-top: 1px solid var(--line);
}

.btn {
    display: inline-block;
    padding: 15px 24px;
    border: 1px solid #568cce;
    border-radius: 11px;
    background: #205eae;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    transition: background .2s ease;
}

.btn:hover {
    background: #2b71c7;
}

/* =========================================
   CONTACT
========================================= */

.contact-box {
    max-width: 850px;
    margin: 40px 0;
    padding: 35px;
    background: #101f32;
    border: 1px solid var(--line);
    border-radius: 18px;
}

.contact-item {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
}

.contact-item:last-child {
    border-bottom: none;
}

.contact-item small {
    display: block;
    color: var(--muted);
    margin-bottom: 8px;
}

.contact-item a {
    color: var(--cyan);
    overflow-wrap: anywhere;
}

.contact-item strong {
    color: var(--text);
}

/* =========================================
   FOOTER
========================================= */

footer {
    padding: 30px 0;
    border-top: 1px solid var(--line);
    background: #03070d;
    color: var(--muted);
    font-size: 12px;
}

.footer-inner {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
}

.footer-links {
    display: flex;
    gap: 20px;
}

.footer-links a {
    color: var(--muted);
}

.footer-links a:hover {
    color: var(--cyan);
}

/* =========================================
   ARABIC
========================================= */

html[dir="rtl"] body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

html[dir="rtl"] h1,
html[dir="rtl"] h2,
html[dir="rtl"] .eyebrow {
    letter-spacing: 0;
}

/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1000px) {

    .nav {
        flex-wrap: wrap;
    }

    .links {
        order: 3;
        width: 100%;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
        border-top: 1px solid var(--line);
        padding-top: 8px;
    }

    .hero-grid {
        grid-template-columns: 1fr;
        padding-top: 175px;
        padding-bottom: 60px;
    }

    .visual {
        max-width: 600px;
        width: 100%;
        margin: auto;
    }

    .hero,
    .hero-grid {
        min-height: auto;
    }

    .page {
        padding-top: 180px;
    }
}

@media (max-width: 600px) {

    .wrap {
        width: calc(100% - 28px);
    }

    nav {
        top: 8px;
    }

    .nav {
        padding: 12px;
    }

    .links {
        gap: 10px;
    }

    .links a,
    .dropdown-trigger {
        font-size: 11px;
    }

    .cards,
    .cards.categories {
        grid-template-columns: 1fr;
    }

    .visual {
        height: 360px;
    }

    .orb {
        width: 220px;
        height: 220px;
    }

    .core {
        width: 80px;
        height: 80px;
        font-size: 35px;
    }

    .node {
        padding: 12px;
        width: 44%;
    }

    .node strong {
        font-size: 11px;
    }

    .node small {
        font-size: 9px;
    }

    .node svg {
        width: 25px;
        height: 25px;
    }

    .protocol-row {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .protocols {
        padding: 20px;
    }

    .section {
        padding: 65px 0;
    }

    .contact-box {
        padding: 22px;
    }
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
    }
}

</style>
</head>

/* =========================================
   ROUTING
========================================= */

const routes = {

    "home": homePage,
    "leistungen": servicesPage,
    "smart-home": smartHomePage,
    "engineering": engineeringPage,
    "projekte": projectsPage,
    "ueber-uns": aboutPage,
    "kontakt": contactPage,
    "impressum": legalPage,
    "datenschutz": privacyPage

};

function currentRoute() {

    const route = window.location.hash.substring(1);

    return Object.hasOwn(routes, route)
        ? route
        : "home";
}

/* =========================================
   NAVIGATION TRANSLATIONS
========================================= */

function updateNavigation() {

    const labels = {

        "home": t(
            "Startseite", "Home", "الرئيسية"
        ),

        "leistungen": t(
            "Alle Leistungen", "All Services", "جميع الخدمات"
        ),

        "smart-home": t(
            "Smart Home", "Smart Home", "المنازل الذكية"
        ),

        "engineering": t(
            "Engineering & Automation",
            "Engineering & Automation",
            "الهندسة والأتمتة"
        ),

        "projekte": t(
            "Projekte", "Projects", "المشاريع"
        ),

        "ueber-uns": t(
            "Über uns", "About Us", "من نحن"
        ),

        "kontakt": t(
            "Kontakt", "Contact", "التواصل"
        ),

        "impressum": t(
            "Impressum", "Legal Notice", "البيانات القانونية"
        ),

        "datenschutz": t(
            "Datenschutz", "Privacy Policy", "الخصوصية"
        )
    };

    document.querySelectorAll("[data-nav]").forEach(link => {

        const key = link.dataset.nav;

        link.textContent = labels[key];

        link.classList.toggle(
            "active",
            currentRoute() === key
        );

    });

    const trigger = document.getElementById("servicesTrigger");

    trigger.textContent = t(
        "Leistungen ▾",
        "Services ▾",
        "الخدمات ▾"
    );

    trigger.classList.toggle(
        "active",
        ["leistungen", "smart-home", "engineering"]
            .includes(currentRoute())
    );

    document.querySelectorAll("[data-lang]").forEach(button => {

        const selected = button.dataset.lang === language;

        button.classList.toggle("on", selected);

        button.setAttribute("aria-pressed", String(selected));

    });
}

/* =========================================
   FLIP CARD INTERACTION
========================================= */

function activateCards() {

    document.querySelectorAll(".flip-card").forEach(card => {

        card.addEventListener("click", event => {

            if (event.target.closest("a")) return;

            card.classList.toggle("flipped");

        });

        card.addEventListener("keydown", event => {

            if (event.target !== card) return;

            if (event.key === "Enter" || event.key === " ") {

                event.preventDefault();

                card.classList.toggle("flipped");

            }

        });

    });
}

/* =========================================
   PAGE RENDERING
========================================= */

function render(scrollToTop = true) {

    document.documentElement.lang = language;

    document.documentElement.dir =
        language === "ar" ? "rtl" : "ltr";

    const route = currentRoute();

    document.getElementById("app").innerHTML = routes[route]();

    updateNavigation();

    activateCards();

    closeMenu();

    if (scrollToTop) {

        window.scrollTo({
            top: 0,
            behavior: "instant"
        });

    }
}

/* =========================================
   DROPDOWN
========================================= */

const menu = document.getElementById("servicesMenu");

const trigger = document.getElementById("servicesTrigger");

function closeMenu() {

    menu.classList.remove("open");

    trigger.setAttribute("aria-expanded", "false");

}

trigger.addEventListener("click", () => {

    const open = menu.classList.toggle("open");

    trigger.setAttribute("aria-expanded", String(open));

});

document.addEventListener("click", event => {

    if (!event.target.closest(".dropdown")) {

        closeMenu();

    }
});

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        closeMenu();

    }
});

/* =========================================
   LANGUAGE SWITCHING
========================================= */

document.querySelectorAll("[data-lang]").forEach(button => {

    button.addEventListener("click", () => {

        language = button.dataset.lang;

        render(false);

    });

});

/* =========================================
   INITIALIZATION
========================================= */

window.addEventListener("hashchange", () => render());

render();

</script>
